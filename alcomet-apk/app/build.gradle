plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alcomet.maintenance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alcomet.maintenance.stable'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0.19'
    }

    buildTypes {
        debug { debuggable false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
