plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alcomet.maintenance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alcomet.maintenance'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.1.2'
    }

    buildTypes {
        debug { debuggable false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
