name: Build ALCOMET APK

on:
  push:
    branches:
      - alcomet-apk-build
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p alcomet-apk assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp alcomet-apk/app/build/outputs/apk/debug/app-debug.apk apk-output/ALCOMET_Maintenance_v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALCOMET-Maintenance-APK
          path: apk-output/ALCOMET_Maintenance_v1.0.apk
          if-no-files-found: error
