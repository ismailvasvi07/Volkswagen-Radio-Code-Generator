name: Build ALCOMET APK

on:
  push:
    branches:
      - alcomet-apk-build
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle -p alcomet-apk assembleRelease --stacktrace

      - name: Prepare unsigned APK and signing tools
        run: |
          mkdir -p apk-output/signing-tools/lib
          cp alcomet-apk/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/ALCOMET_Maintenance_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" apk-output/signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-output/signing-tools/lib/apksigner.jar
          chmod +x apk-output/signing-tools/apksigner

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: ALCOMET-Maintenance-Unsigned
          path: apk-output
          if-no-files-found: error
