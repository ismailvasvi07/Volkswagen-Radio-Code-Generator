name: Export Android Signing Tools
on:
  push:
    branches:
      - alcomet-apk-build
  workflow_dispatch:
jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Prepare signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools
          if-no-files-found: error
